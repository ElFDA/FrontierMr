name: Theme editor programs

# The Python theme editor (tools/fe/theme_editor.py) as a program which needs nothing installed:
# Windows (.exe), macOS (.app for Apple Silicon, in a zip) and Linux (x86_64, in a tar.gz), made by
# PyInstaller on each system. On a published release the three files are attached to it; started
# by hand (Actions > Theme editor programs > Run workflow) they are attached to the release named in
# "tag" (e.g. the latest one, so that the download links of the guides work), or else kept as
# artifacts of the run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the programs to (empty: only artifacts of the run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --onefile --windowed
            exe: dist/FrontierThemeEditor.exe
            asset: FrontierThemeEditor-windows.exe
          - os: macos-latest
            flags: --windowed --osx-bundle-identifier io.github.elfda.frontier.themeeditor
            exe: dist/FrontierThemeEditor.app/Contents/MacOS/FrontierThemeEditor
            asset: FrontierThemeEditor-macos.zip
          - os: ubuntu-22.04   # an older glibc: the program starts on older distributions too
            flags: --onefile
            exe: dist/FrontierThemeEditor
            asset: FrontierThemeEditor-linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PySide6 and PyInstaller
        run: python -m pip install PySide6==6.12.0 pyinstaller==6.22.3

      - name: Qt libraries for the test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build
        run: pyinstaller --noconfirm --clean ${{ matrix.flags }} --name FrontierThemeEditor tools/fe/theme_editor.py

      - name: Test that it starts
        run: |
          python - <<'EOF'
          import os, subprocess, sys, tempfile, time
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen', FRONTIER_THEME_EDITOR_HOME=tempfile.mkdtemp())
          # its output in a file: a --onefile program runs in a child process, which must not keep the step's output open
          log = open('editor.log', 'w+')
          p = subprocess.Popen(['${{ matrix.exe }}', 'tools/fe/sd/frontier/themes/citypop_blue'], env=env,
                               stdin=subprocess.DEVNULL, stdout=log, stderr=log)
          time.sleep(20)
          alive = p.poll() is None
          # SIGTERM reaches the child too (the bootloader passes it on); on Windows the whole tree is ended
          if os.name == 'nt':
              subprocess.run(['taskkill', '/F', '/T', '/PID', str(p.pid)], capture_output=True)
          else:
              p.terminate()
          try:
              p.wait(30)
          except subprocess.TimeoutExpired:
              p.kill()
          log.seek(0)
          print(log.read())
          if not alive:
              sys.exit('the editor stopped at the start, code %s' % p.returncode)
          print('the editor was running')
          EOF

      - name: Package
        run: |
          case "${{ runner.os }}" in
            Windows) cp dist/FrontierThemeEditor.exe "${{ matrix.asset }}" ;;
            macOS) ditto -c -k --keepParent dist/FrontierThemeEditor.app "${{ matrix.asset }}" ;;
            Linux) tar -czf "${{ matrix.asset }}" -C dist FrontierThemeEditor ;;
          esac
          ls -l "${{ matrix.asset }}"

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber

      - name: Keep as an artifact
        if: github.event_name != 'release' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
