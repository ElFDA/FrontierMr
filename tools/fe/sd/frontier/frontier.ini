; Frontier settings (/media/fat/frontier/frontier.ini)
; theme = folder in frontier/themes (e.g. citypop_blue, citypop, citypop_dark, simple;
;       also from "Frontier Settings" > "Themes" > "Theme"), "none" = built-in look (8x8 font)
theme=citypop_blue

; text_layout = 1: descriptions in place of the pictures of the games (for those who scrape
;       only the texts; the themes have elements with layout=text). Also from
;       "Frontier Settings" > "Themes" > "Text layout".
text_layout=0

; recent = how many games "Recent" (main screen) shows, the last one played first
;       (0 = no "Recent"). Also from "Frontier Settings" > "Recent games".
recent=50

; newest = days a new arcade game stays in "#Newest" (first in the Arcade folder), 0 = no
;       "#Newest". See NEWEST ARCADE GAMES in README.txt.
newest=30

; screensaver = after how many seconds without keys random games are shown (their video
;       or picture and description, with the look of the theme: screensaver.ini); Start on
;       the gamepad (Space on the keyboard) plays the game shown, any other button goes
;       back. 0 = off. Also from "Frontier Settings" > "Screensaver" > "Start after".
; screensaver_time = seconds for each game (10-300, default 30)
; screensaver_transition = effect between two games: fade, slide, wipe or none
; screensaver_transition_ms = how long the effect lasts (100-3000, default 700)
;       The three are also in "Frontier Settings" > "Screensaver".
screensaver=300
screensaver_time=30
screensaver_transition=fade

; loading_screen=0 turns off the loading screen: while a core loads the game HDMI
;       shows the theme's loading.ini (the game, its box, a bar) instead of the bar
;       of the OSD; the CRT gets a loading screen in the OSD (white on the core's
;       picture: the analog output of a core shows only the core and the OSD).
;       With direct_video=1 for the games the CRT gets the one of the theme too.
; loading_crt=0 keeps the bar of the OSD on the CRT

; games_wait = at most how many seconds to wait at start for games/ when it is on a disk
;       mounted after the MiSTer starts (e.g. a link to a USB disk). It is checked at once:
;       as soon as the disk is there Frontier shows the systems (it reads games/ again
;       every 2 s) and Coin-Op starts the game. 0 = games on the SD card, no wait.
games_wait=0

; debug=1 writes the time of every redraw on stderr
; fps=30 frames per second limit of the animations (1-60)
; video_volume=40  sound of the mp4 videos, 0-100 (0 = no sound; default 40, lower than
;       the games)
; crt=1 Frontier also on the CRT connected to the VGA of the I/O board (15 kHz):
;       draws at 640x240 and HDMI shows the same picture scaled up in 4:3
; crt_interlace=1 with Frontier's menu.rbf: the CRT gets 640x480 interlaced (480i):
;       tested, it flickers too much on the CRT, so the default is 0 = progressive 640x240
; crt_flicker=1 vertical filter for the interlaced pages (only with crt_interlace=1)
; picture on the CRT (also from "Frontier Settings" > "CRT Geometry", where it is seen at once):
; crt_width=100 crt_height=100  size in percent of the screen (50-100)
; crt_hpos=24  moves it 24 pixels to the right (negative = left, -64..64); with the
;       Frontier's menu.rbf the sync moves (steps of 4 pixels, -32..28), the rest by
;       drawing it moved. Works with crt=1 and also with direct_video=1 in MiSTer.ini
; crt_vpos=4  moves it 4 lines down (negative = up, -32..32)
;       Only for the screens of Frontier: the games show the picture of their core
; coinop=1  Coin-Op mode: at power on the last game launched from Frontier starts
;       again (also from "Frontier Settings" > "Coin-Op mode").
;       coinop_delay=0 seconds of countdown before the start (any button cancels it, 0 = at once);
;       coinop_safe=60: if the MiSTer is switched off (or hangs) before the game has run
;       for these seconds, at the next power on nothing starts (anti-panic: a game which
;       doesn't show on the CRT -> switch off and on within a minute). An empty file
;       frontier/coinop.off turns it off too.
; panic_combo=0  turns off L+R+Select+Start held for 2 seconds in a game = back to the menu
; hidden=NES,Atari5200,_Arcade  systems (games/ folders, _Arcade) not shown in the lists
;       and in the screensaver; also from "Frontier Settings" > "Visible systems"
; scrape_systems=, scrape_lang=en, scrape_text=1, scrape_media=box,snap,title,marquee,video,
;       scrape_redo=0 (0 only what is missing, 1 the texts again, 2 everything again,
;       3 also the games not found in the last 30 days):
;       the choices of "Frontier Settings" > "Scraper"
; regions=USA,World,Europe,Japan  order of the regions for the version which starts
;       from the list of the games of a system (the others are in the details, X)
; exclude_dirs=Extra  folders skipped by the list by title and by the scraper (at
;       any level, more names separated by commas, empty = none): unlicensed games,
;       prototypes, hacks and duplicates in games/<system>/Extra stay in "Folders"
; rescan=manual  (default) the lists of the games, of the systems and of the arcade
;       versions are read the first time and kept in frontier/.cache: they are read
;       again only holding X on a system, on "Folders", on a category or on Arcade
;       (or with F5); rescan=auto checks them in the background at every start (also
;       coming back from a game)
