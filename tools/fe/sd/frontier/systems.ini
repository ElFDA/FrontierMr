; Systems for Frontier (/media/fat/frontier/systems.ini): folders in games/ -> core and MGL.
; Made by tools/fe/systems/gen_systems.py from the MiSTer catalog of Zaparoo
; (https://github.com/ZaparooProject/zaparoo-core, mister/catalog/catalog.json, GPL-3.0).
; It can be edited by hand; F5 in Frontier reads it again.
;   name      name shown
;   wiki      English Wikipedia article of the system (data of the system for the scraper)
;   category  Console, Handheld, Computer, Other
;   rbf       core, as in the <rbf> tag of the MGLs (folder/name without date)
;   folders   folders in games/ separated by |
;   setname   <setname> of the MGL (optional), setname_same_dir=1 for same_dir="1"
;   romsets   1 = romsets as the Neo Geo core loads them: zip files and folders of romsets.xml (in slot1)
;   reset     seconds (optional): <reset> after a disk image (type s) is mounted, for the systems whose disk boots
;              at the reset (tested: ColecoAdam, AppleIII)
;   autorun   PRG (path from the root) loaded after a disk image (type s), by the first f slot with prg: the C64 one
;              types LOAD"*",8,1 and RUN, so the disk starts (made like MeGaLoSorTer's launchers)
;   slotN     type,index,delay,extensions (type f = file, s = disk image; extensions separated by spaces)
;              index = the number of the entry in the core's configuration string (F1 = f,1; S0 = s,0; F or
;              no number = 0): the MGL finds the OSD entry by it; a wrong number loads the first entry of the OSD.
;              Entries on a sub page of the OSD (P1...) cannot be reached by an MGL.
;              tools/fe/systems/check_conf.py compares the slots with the real cores.
;   launchers  MGLs of the root (e.g. _Computer/Amiga 500HD.mgl) shown first in the folder of the system, separated by |:
;              the configurations of a core which boot by themselves (Amiga with a hard disk), as in the MiSTer view
;              a path ending with / = all the MGLs of that folder (_Computer/_X68000 Games/)
