; Default theme: screensaver.
; Also used by the themes without their own screensaver.ini (with the pictures of this theme).
; Random games after some time without keys (screensaver= in frontier.ini, also in
; "Frontier Settings" > "Screensaver"): Start on the gamepad (Space on the keyboard) plays
; the game shown, any other button goes back. Same keys and variables as detail.ini
; (without the versions), plus ${system.name}: the system of the game.

[theme]
name=Default
base=1280x720
background_color=#0E1420
font=fonts/DejaVuSans.ttf
size=24
color=#F0F0F0

[background]
type=rect
rect=0,0,1280,720
color=#18233A
gradient=#080C14

[header]
type=rect
rect=0,0,1280,84
color=#1C2A44E0

[header_line]
type=rect
rect=0,84,1280,2
color=#FFC04080

[title]
type=text
rect=40,0,1080,84
text=${game.title}
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040
shadow=#00000080
scroll=horizontal

[folder]
type=text
rect=1120,0,120,84
text=${system}
size=20
color=#8CA0C0
align=right

[image_panel]
type=rect
rect=24,100,656,492
color=#0A101CA0

[no_image]
type=text
rect=32,108,640,476
text=${game.title}
ifnot=${media.snap}${media.title}${media.fanart}
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#3A4A66
align=center
wrap=1

[image]
type=image
rect=32,108,640,476
src=${media.snap}|${media.title}|${media.fanart}
fit=contain

[favorite]
type=text
rect=624,112,44,44
text=★
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040
shadow=#000000C0
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

[video]
type=video
rect=32,108,640,476
src=${media.video}
fit=contain
delay=800

[panel]
type=rect
rect=700,100,556,556
color=#0A101CA0

[box]
type=image
rect=1100,112,144,190
src=${media.box}
fit=contain
align=right
valign=top

[year]
type=text
rect=716,112,380,30
text=${game.year}
size=20
color=#8CA0C0

[developer]
type=text
rect=716,142,380,30
text=Developer: ${game.developer}
if=${game.developer}
size=20
color=#C8D0E0

[publisher]
type=text
rect=716,172,380,30
text=Publisher: ${game.publisher}
if=${game.publisher}
size=20
color=#C8D0E0

[genre]
type=text
rect=716,202,380,30
text=${game.genre}
size=20
color=#8CA0C0

[players]
type=text
rect=716,232,200,30
text=Players: ${game.players}
if=${game.players}
size=20
color=#8CA0C0

[stars]
type=text
rect=916,232,180,30
text=${game.stars}
size=20
color=#FFC040

[description]
type=text
rect=716,310,524,340
text=${game.desc}
size=20
color=#C8D0E0
wrap=1
valign=top
scroll=vertical

[footer]
type=rect
rect=0,672,1280,48
color=#1C2A44E0

[help]
type=text
rect=40,672,1200,48
text=${system.name}   -   Start: play this game   -   any other button: back to the list
size=20
color=#8CA0C0
ifnot=${message}

[message]
type=text
rect=40,672,1200,48
text=${message}
size=20
color=#FFD878
if=${message}
; notices (e.g. a setting changed by another program), in place of the help for a moment
