; Default theme of Frontier, variant for 4:3 screens (CRT, 640x240...).
; Used instead of theme.ini when the screen is narrower than about 3:2.
; Variables and keys: see theme.ini.

[theme]
name=Default
base=960x720
background_color=#0E1420
font=fonts/DejaVuSans.ttf
size=24
color=#F0F0F0

[background]
type=rect
rect=0,0,960,720
color=#18233A
gradient=#080C14

[header]
type=rect
rect=0,0,960,84
color=#1C2A44E0

[header_line]
type=rect
rect=0,84,960,2
color=#FFC04080

[title]
type=text
rect=24,0,700,84
text=${title}
font=fonts/DejaVuSans-Bold.ttf
size=40
color=#FFC040
shadow=#00000080

[position]
type=text
rect=700,0,236,84
text=${pos}
size=24
color=#8CA0C0
align=right

[list]
type=list
rect=12,96,516,568
size=28
row_height=44
padding=10
color=#F0F0F0
dir_color=#FFD878
tag_color=#8CA0C0
tag_dir=>
tag_up=<
sel_background=#2F5FB3
sel_color=#FFFFFF
scrollbar_width=6
scrollbar_color=#3A4A66
scrollbar_knob=#8CA0C0
empty_text=No cores or games
sel_scroll=1

[letter_back]
type=rect
rect=684,191,120,120
color=#0A101CE0
if=${jump}
; L/R: letter jumped to, for a second

[letter]
type=text
rect=684,191,120,120
text=${jump}
font=fonts/DejaVuSans-Bold.ttf
size=80
color=#FFD878
align=center
if=${jump}

[panel]
type=rect
rect=540,96,408,568
color=#0A101CA0

[image]
type=image
rect=548,104,392,294
src=${media.system}|${media.snap}|${media.title}|${media.box}|${media.fanart}
fit=contain
layout=media

[favorite]
type=text
rect=892,108,44,44
text=★
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040
shadow=#000000C0
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

[no_image]
type=text
rect=548,104,392,294
text=${game.title}
ifnot=${media.system}${media.snap}${media.title}${media.box}${media.fanart}
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#3A4A66
align=center
wrap=1
layout=media

[text_system]
type=image
rect=548,104,392,294
src=${media.system}
fit=contain
ifnot=${game.desc}
layout=text

[text_desc]
type=text
rect=554,110,321,282
text=${game.desc}
size=24
color=#C8D0E0
wrap=1
valign=top
scroll=vertical
layout=text

[name]
type=text
rect=552,404,388,46
text=${game.title}
font=fonts/DejaVuSans-Bold.ttf
size=30
color=#FFC040
scroll=horizontal

[year_developer]
type=text
rect=552,450,388,38
text=${game.year}  ${game.developer}
size=26
color=#8CA0C0

[genre]
type=text
rect=552,488,388,38
text=${game.genre}
size=26
color=#8CA0C0

[footer]
type=rect
rect=0,672,960,48
color=#1C2A44E0

[help]
type=text
rect=24,672,912,48
text=A: open   X: details (hold: favorite)   B: back
size=24
color=#8CA0C0
ifnot=${message}

[message]
type=text
rect=24,672,912,48
text=${message}
size=24
color=#FFD878
if=${message}
; "Added to favorites" / "Removed from favorites", in place of the help for a moment
