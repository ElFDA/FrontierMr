; Default theme: screensaver, 4:3 variant (CRT, 640x240...). See screensaver.ini.
; Random games after some time without keys (screensaver= in frontier.ini, also in
; "Frontier Settings" > "Screensaver"): Start on the gamepad (Space on the keyboard) plays
; the game shown, any other button goes back. Same keys and variables as detail.ini
; (without the versions), plus ${system.name}: the system of the game.

[theme]
name=Default
base=960x720
background_color=#0E1420
font=fonts/DejaVuSans.ttf
size=24
color=#F0F0F0

[background]
type=rect
rect=0,0,960,720
color=#18233A
gradient=#080C14

[header]
type=rect
rect=0,0,960,84
color=#1C2A44E0

[title]
type=text
rect=24,0,912,84
text=${game.title}
font=fonts/DejaVuSans-Bold.ttf
size=40
color=#FFC040
shadow=#00000080
scroll=horizontal

[no_image]
type=text
rect=24,100,440,330
text=${game.title}
ifnot=${media.snap}${media.title}${media.fanart}
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#3A4A66
align=center
wrap=1

[image]
type=image
rect=24,100,440,330
src=${media.snap}|${media.title}|${media.fanart}
fit=contain

[video]
type=video
rect=24,100,440,330
src=${media.video}
fit=contain
delay=800
; the video of the game, on its picture

[favorite]
type=text
rect=416,104,44,44
text=★
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040
shadow=#000000C0
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

[info]
type=text
rect=24,440,440,36
text=${game.year}  ${game.developer}
size=26
color=#8CA0C0

[genre]
type=text
rect=24,476,300,36
text=${game.genre}
size=26
color=#8CA0C0

[stars]
type=text
rect=324,476,140,36
text=${game.stars}
size=26
color=#FFC040
align=right

[description]
type=text
rect=488,100,448,560
text=${game.desc}
size=24
color=#C8D0E0
wrap=1
valign=top
scroll=vertical

[footer]
type=rect
rect=0,672,960,48
color=#1C2A44E0

[help]
type=text
rect=24,672,912,48
text=${system.name} - Start: play - other buttons: back
size=24
color=#8CA0C0
ifnot=${message}

[message]
type=text
rect=24,672,912,48
text=${message}
size=24
color=#FFD878
if=${message}
; notices (e.g. a setting changed by another program), in place of the help for a moment
