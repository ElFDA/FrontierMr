; Default theme: loading screen, shown on HDMI while a core loads the game
; (instead of the bar of the OSD). Also used by the themes without their own
; loading.ini. Same keys as theme.ini, plus type=bar: value= percent of its
; width drawn in color, background= the empty part (none = transparent).
; Variables: ${progress} (0-100, of the file being loaded), ${loading.file},
; ${system.name} and the ${game.*} / ${media.*} of the game launched from
; Frontier (only ${game.title} = file name for a game loaded from the OSD).
; Off with loading_screen=0 in frontier.ini. anim/spinner_*.png:
; tools/fe/themegen/simple_loading.py.

[theme]
name=Default
base=1280x720
background_color=#0E1420
font=fonts/DejaVuSans.ttf
size=24
color=#F0F0F0

[background]
type=rect
rect=0,0,1280,720
color=#18233A
gradient=#080C14

[image_panel]
type=rect
rect=80,140,500,440
color=#0A101CA0

[cover]
type=image
rect=92,152,476,416
src=${media.box}|${media.snap}|${media.title}
fit=contain

[no_cover]
type=text
rect=92,152,476,416
text=${game.title}
ifnot=${media.box}${media.snap}${media.title}
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#3A4A66
align=center
wrap=1

[spinner]
type=image
rect=640,150,64,64
src=anim/spinner_*.png
fps=12
fit=contain

[loading]
type=text
rect=724,150,500,64
text=Loading
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040

[game]
type=text
rect=640,250,580,56
text=${game.title}
font=fonts/DejaVuSans-Bold.ttf
size=34
color=#F0F0F0
scroll=horizontal

[system]
type=text
rect=640,310,580,40
text=${system.name}
size=24
color=#8CA0C0

[percent]
type=text
rect=640,420,560,40
text=${progress}%
size=24
color=#8CA0C0
align=right

[bar]
type=bar
rect=640,466,560,16
value=${progress}
color=#FFC040
background=#1C2A44

[file]
type=text
rect=80,640,1120,40
text=${loading.file}
size=18
color=#3A4A66
scroll=horizontal
