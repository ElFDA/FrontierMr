; Default theme of Frontier (16:9). For 4:3 screens there is theme_43.ini.
;
; Coordinates in "base" units (here 1280x720), scaled to the real screen.
; Every section after [theme] is an element, drawn in the order of the file.
; Colors: #RRGGBB or #RRGGBBAA (AA = opacity).
; Variables: ${title} ${folder} ${pos} ${count} ${system}
;   ${game.name} ${game.title} ${game.file} ${game.date} ${game.desc} ${game.year}
;   ${game.released} ${game.developer} ${game.publisher} ${game.genre} ${game.players}
;   ${game.rating} ${game.stars}
;   ${media.box} ${media.snap} ${media.title} ${media.marquee} ${media.fanart} ${media.video}
;   ${jump} = letter chosen with L/R (empty after a second)
;   ${game.favorite} = "1" if the game is in the favorites (X held), otherwise empty
;   ${message} = notice for a moment ("Added to favorites", "Removed from favorites", "Updating: ...")
;   ${media.system} = picture of the theme for the main screen and for the systems:
;     media/systems/<key>.png|.jpg in the theme folder, key = favorites, arcade,
;     computer, console, handheld, other, mister, settings or folder of games/ or id of systems.ini
;     (lowercase); in the favorites the systems use the same pictures
; if=${...} / ifnot=${...}: the element is shown only if the text is not empty / empty.
; layout=media: only with "Text layout" OFF (the pictures of the games); layout=text: only with
;   it ON (text_layout=1: descriptions in place of the pictures); without layout: always.
; On a system ${game.desc} ${game.developer} ${game.year} ${game.genre} are its data (Wikipedia),
;   with ${game.cpu} ${game.memory} ${game.graphics} ${game.sound} ${game.media} ${game.units}...
; Animations: transition=fade <ms> (pictures), scroll=horizontal|vertical (texts which don't fit,
;   scroll_speed in base px per second, scroll_delay in ms), sel_scroll=1 (list: selected name
;   too long scrolls), src with * = frame animation (fps=).
; List: center=1 keeps the selection still in the middle and scrolls the list (as a ring if
;   it is longer than the space; better an odd number of rows: height / row_height).
; type=video: src=${media.video} (.mjv), starts after delay ms on the same game.
; Text: font=<.ttf> size=<base px>, font_width=<percent> (narrower glyphs: more text per
;   line, e.g. 85 on the CRT), font_hinting=light|mono|full|none ([theme] only; light = default,
;   horizontal strokes on whole lines: crisp at 240p).
[theme]
name=Default
base=1280x720
background_color=#0E1420
font=fonts/DejaVuSans.ttf
size=24
color=#F0F0F0

[background]
type=rect
rect=0,0,1280,720
color=#18233A
gradient=#080C14

[header]
type=rect
rect=0,0,1280,84
color=#1C2A44E0

[header_line]
type=rect
rect=0,84,1280,2
color=#FFC04080

[title]
type=text
rect=40,0,900,84
text=${title}
font=fonts/DejaVuSans-Bold.ttf
size=40
color=#FFC040
shadow=#00000080

[position]
type=text
rect=940,0,300,84
text=${pos}
size=24
color=#8CA0C0
align=right

[list]
type=list
rect=24,100,640,556
size=24
row_height=37
padding=12
color=#F0F0F0
dir_color=#FFD878
tag_color=#8CA0C0
tag_dir=>
tag_up=<
sel_background=#2F5FB3
sel_color=#FFFFFF
scrollbar_width=6
scrollbar_color=#3A4A66
scrollbar_knob=#8CA0C0
empty_text=No cores or games in this folder
sel_scroll=1

[letter_back]
type=rect
rect=900,196,140,140
color=#0A101CE0
if=${jump}
; L/R: letter jumped to, for a second

[letter]
type=text
rect=900,196,140,140
text=${jump}
font=fonts/DejaVuSans-Bold.ttf
size=96
color=#FFD878
align=center
if=${jump}

[panel]
type=rect
rect=684,100,572,556
color=#0A101CA0

[image]
type=image
rect=700,116,540,300
src=${media.system}|${media.snap}|${media.title}|${media.fanart}
fit=contain
layout=media

[favorite]
type=text
rect=1192,120,44,44
text=★
font=fonts/DejaVuSans-Bold.ttf
size=36
color=#FFC040
shadow=#000000C0
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

[no_image]
type=text
rect=700,116,540,300
text=${game.title}
ifnot=${media.system}${media.snap}${media.title}${media.fanart}
font=fonts/DejaVuSans-Bold.ttf
size=34
color=#3A4A66
align=center
wrap=1
layout=media

[box]
type=image
rect=1110,430,130,180
src=${media.box}
fit=contain
align=right
valign=top
layout=media

[text_system]
type=image
rect=700,116,540,300
src=${media.system}
fit=contain
ifnot=${game.desc}
layout=text

[text_desc]
type=text
rect=708,124,465,284
text=${game.desc}
size=17
color=#C8D0E0
wrap=1
valign=top
scroll=vertical
layout=text

[name]
type=text
rect=700,428,400,36
text=${game.title}
font=fonts/DejaVuSans-Bold.ttf
size=26
color=#FFC040
scroll=horizontal

[year_developer]
type=text
rect=700,466,400,28
text=${game.year}  ${game.developer}
size=19
color=#8CA0C0

[genre]
type=text
rect=700,494,400,28
text=${game.genre}
size=19
color=#8CA0C0

[players]
type=text
rect=700,522,200,28
text=${game.players}
size=19
color=#8CA0C0

[stars]
type=text
rect=900,522,200,28
text=${game.stars}
size=19
color=#FFC040

[footer]
type=rect
rect=0,672,1280,48
color=#1C2A44E0

[help]
type=text
rect=40,672,1200,48
text=A/Enter: open   X: details (hold: favorite)   B/Esc: back   L/R: letter   F12: menu   R2: browser
size=20
color=#8CA0C0
ifnot=${message}

[message]
type=text
rect=40,672,1200,48
text=${message}
size=20
color=#FFD878
if=${message}
; "Added to favorites" / "Removed from favorites", in place of the help for a moment
