; Theme "City Pop": Japanese pop of the bubble era, detail screen.
; Pale pink with a dashed grid, mint and blue, a pink bubble, offset shadows.
; img/detail.png (tools/fe/themegen/citypop_assets.py) has the panels and the help
; bar: the rect= below follow it. Variables and keys: see themes/simple/theme.ini.

[theme]
name=City Pop
base=1280x720
background=img/detail.png
background_fit=stretch
background_color=#F4D5D5
font=../simple/fonts/PTSansNarrow-Bold.ttf
size=32
color=#212121

[title]
type=text
rect=190,8,1064,90
text=${game.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=72
color=#69D2BA
shadow=#3C6BB1
shadow_offset=4
scroll=horizontal

[no_image]
type=text
rect=42,124,564,310
text=${game.title}
ifnot=${media.snap}${media.title}${media.box}
font=../simple/fonts/BebasNeue-Regular.ttf
size=60
color=#E2CACA
align=center
wrap=1
layout=media

[image]
type=image
rect=42,124,564,310
src=${media.snap}|${media.title}|${media.box}
fit=contain
layout=media

[video]
type=video
rect=42,124,564,310
src=${media.video}
fit=contain
delay=800
layout=media

[favorite]
type=text
rect=42,124,48,48
text=★
font=../simple/fonts/DejaVuSans-Bold.ttf
size=40
color=#FFA3D9
shadow=#3C6BB1
shadow_offset=3
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

; pink tag with the year on the corner of the picture
[year_tag]
type=image
rect=484,96,132,60
src=img/tag.png
if=${game.year}

[year]
type=text
rect=504,96,104,52
text=${game.year}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
align=right

[maker]
type=text
rect=26,452,590,44
text=${game.developer}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
shadow=#7AA1DB
shadow_offset=3
scroll=horizontal

[genre]
type=text
rect=26,498,590,36
text=${game.genre}
color=#585858
scroll=horizontal

[players]
type=text
rect=26,534,590,36
text=${game.players} players
if=${game.players}
color=#747474

[stars]
type=text
rect=26,572,590,40
text=${game.stars}
font=../simple/fonts/DejaVuSans-Bold.ttf
size=28
color=#EC76B2

[description]
type=text
rect=662,126,566,300
text=${game.desc}
size=28
color=#212121
wrap=1
valign=top
scroll=vertical
layout=media

[text_desc]
type=text
rect=50,180,548,246
text=${game.desc}
size=28
color=#212121
wrap=1
valign=top
scroll=vertical
layout=text

[versions_title]
type=text
rect=662,432,566,42
text=Versions ${versions.status}
font=../simple/fonts/BebasNeue-Regular.ttf
size=38
color=#3C6BB1

[versions_pos]
type=text
rect=662,432,566,42
text=${pos}
font=../simple/fonts/BebasNeue-Regular.ttf
size=38
color=#EC76B2
align=right

[versions]
type=list
rect=652,477,574,153
row_height=51
padding=18
color=#212121
sel_image=img/sel.png
sel_color=#002967
sel_scroll=1
scrollbar_width=4
scrollbar_color=#EAD9D9
scrollbar_knob=#FFA3D9

[help]
type=text
rect=60,648,1160,51
text=A PLAY    UP/DOWN VERSION    B/X BACK    HOLD X FAVORITE
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#002967
ifnot=${message}

[message]
type=text
rect=60,648,1160,51
text=${message}
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#FFFFFF
shadow=#3C6BB1
shadow_offset=3
if=${message}
; "Added to favorites" / "Removed from favorites", in place of the help for a moment
