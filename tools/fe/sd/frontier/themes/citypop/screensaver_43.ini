; Theme "City Pop": Japanese pop of the bubble era, screensaver, 4:3 variant (CRT 640x240).
; Pale pink with a dashed grid, mint and blue, a pink bubble, offset shadows.
; img/detail_43.png (tools/fe/themegen/citypop_assets.py) has the panels and the help
; bar: the rect= below follow it. Variables and keys: see themes/simple/theme.ini.
; Random games after some time without keys (screensaver= in frontier.ini, also in
; "Frontier Settings" > "Screensaver"): Start on the gamepad (Space on the keyboard) plays
; the game shown, any other button goes back. Same keys and variables as detail.ini
; (without the versions), plus ${system.name}: the system of the game.

[theme]
name=City Pop
base=960x720
background=img/detail_43.png
background_fit=stretch
background_color=#F4D5D5
font=../simple/fonts/PTSansNarrow-Bold.ttf
size=32
color=#212121

[title]
type=text
rect=190,8,744,90
text=${game.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=72
color=#69D2BA
shadow=#3C6BB1
shadow_offset=4
scroll=horizontal

[no_image]
type=text
rect=42,124,414,310
text=${game.title}
ifnot=${media.snap}${media.title}${media.box}
font=../simple/fonts/BebasNeue-Regular.ttf
size=60
color=#E2CACA
align=center
wrap=1

[image]
type=image
rect=42,124,414,310
src=${media.snap}|${media.title}|${media.box}
fit=contain

[video]
type=video
rect=42,124,414,310
src=${media.video}
fit=contain
delay=800

[favorite]
type=text
rect=42,124,48,48
text=★
font=../simple/fonts/DejaVuSans-Bold.ttf
size=40
color=#FFA3D9
shadow=#3C6BB1
shadow_offset=3
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

; pink tag with the year on the corner of the picture
[year_tag]
type=image
rect=334,96,132,60
src=img/tag.png
if=${game.year}

[year]
type=text
rect=354,96,104,52
text=${game.year}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
align=right

[maker]
type=text
rect=26,452,440,44
text=${game.developer}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
shadow=#7AA1DB
shadow_offset=3
scroll=horizontal

[genre]
type=text
rect=26,498,440,36
text=${game.genre}
color=#585858
scroll=horizontal

[players]
type=text
rect=26,534,440,36
text=${game.players} players
if=${game.players}
color=#747474

[stars]
type=text
rect=26,572,440,40
text=${game.stars}
font=../simple/fonts/DejaVuSans-Bold.ttf
size=28
color=#EC76B2

[description]
type=text
rect=504,126,404,504
text=${game.desc}
size=28
color=#212121
wrap=1
valign=top
scroll=vertical

[help]
type=text
rect=60,648,840,51
text=${system.name}   START PLAY   ANY BUTTON BACK
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#002967
ifnot=${message}

[message]
type=text
rect=60,648,840,51
text=${message}
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#FFFFFF
shadow=#3C6BB1
shadow_offset=3
if=${message}
; notices (e.g. a setting changed by another program), in place of the help for a moment
