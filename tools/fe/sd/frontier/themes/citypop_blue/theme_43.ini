; Theme "City Pop Blue": Japanese pop of the bubble era, list, 4:3 variant (CRT 640x240).
; Variant of citypop: background of the blue of the titles.
; Its ini files are made from those of citypop by citypop_assets.py.
; img/bg_43.png (tools/fe/themegen/citypop_assets.py) has the panels and the help
; bar: the rect= below follow it. Variables and keys: see themes/simple/theme.ini.

[theme]
name=City Pop Blue
base=960x720
background=img/bg_43.png
background_fit=stretch
background_color=#3C6BB1
font=../simple/fonts/PTSansNarrow-Bold.ttf
size=32
color=#212121

[title]
type=text
rect=190,8,514,90
text=${title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=72
color=#69D2BA
shadow=#002967
shadow_offset=4
scroll=horizontal

[position]
type=text
rect=710,14,224,84
text=${pos}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#F5F7FF
shadow=#002967
shadow_offset=3
align=right

[list]
type=list
rect=42,117,424,510
row_height=51
padding=18
color=#212121
dir_color=#3C6BB1
tag_color=#EC76B2
tag_dir=>
tag_up=<
sel_image=img/sel_43.png
sel_color=#002967
sel_scroll=1
scrollbar_width=4
scrollbar_color=#D8DAE1
scrollbar_knob=#FFA3D9
empty_text=No games

[no_image]
type=text
rect=504,124,404,310
text=${game.title}
ifnot=${media.system}${media.snap}${media.title}${media.box}
font=../simple/fonts/BebasNeue-Regular.ttf
size=60
color=#D8DAE1
align=center
wrap=1
layout=media

[image]
type=image
rect=504,124,404,310
src=${media.system}|${media.snap}|${media.title}|${media.box}
fit=contain
layout=media

[text_system]
type=image
rect=504,124,404,310
src=${media.system}
fit=contain
ifnot=${game.desc}
layout=text

[text_desc]
type=text
rect=510,178,392,250
text=${game.desc}
size=28
color=#212121
wrap=1
valign=top
scroll=vertical
layout=text

[favorite]
type=text
rect=504,124,48,48
text=★
font=../simple/fonts/DejaVuSans-Bold.ttf
size=40
color=#FFA3D9
shadow=#3C6BB1
shadow_offset=3
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

; pink tag with the year on the corner of the picture
[year_tag]
type=image
rect=802,96,132,60
src=img/tag.png
if=${game.year}

[year]
type=text
rect=822,96,104,52
text=${game.year}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
align=right

[letter_shadow]
type=rect
rect=657,196,110,110
color=#7AA1DB
if=${jump}
; L/R: letter jumped to, for a second

[letter_back]
type=rect
rect=651,190,110,110
color=#69D2BA
if=${jump}

[letter]
type=text
rect=651,190,110,110
text=${jump}
font=../simple/fonts/BebasNeue-Regular.ttf
size=96
color=#002967
align=center
if=${jump}

[name]
type=text
rect=494,452,440,62
text=${game.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=60
color=#F5F7FF
shadow=#002967
shadow_offset=3
scroll=horizontal

[maker]
type=text
rect=494,514,440,36
text=${game.developer}
color=#DCE6F7
scroll=horizontal

[genre]
type=text
rect=494,550,440,36
text=${game.genre}
color=#B4C8EA
scroll=horizontal

[stars]
type=text
rect=494,588,440,40
text=${game.stars}
font=../simple/fonts/DejaVuSans-Bold.ttf
size=28
color=#FFA3D9

[help]
type=text
rect=60,648,840,51
text=A PLAY   X DETAILS   B BACK   HOLD X FAV
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#002967
ifnot=${message}

[message]
type=text
rect=60,648,840,51
text=${message}
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#FFFFFF
shadow=#3C6BB1
shadow_offset=3
if=${message}
; "Added to favorites" / "Removed from favorites", in place of the help for a moment
