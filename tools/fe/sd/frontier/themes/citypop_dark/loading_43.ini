; Theme "City Pop Dark": Japanese pop of the bubble era, loading screen, 4:3 variant (CRT 640x240).
; Variant of citypop: dark background (the dark mode of bubblism.jp).
; Its ini files are made from those of citypop by citypop_assets.py.
; Shown on HDMI while a core loads the game (instead of the bar of the OSD).
; img/loading_43.png and anim/ (tools/fe/themegen/citypop_assets.py) have the sleeve,
; the empty bar and the help bar, the record and the bubbles: the rect= below
; follow them. Variables: ${progress} (0-100, of the file being loaded),
; ${loading.file}, ${system.name} and the ${game.*} / ${media.*} of the game
; launched from Frontier (only ${game.title} = file name for a game loaded from
; the OSD). Keys: see themes/simple/theme.ini; type=bar draws value= percent of
; its width in color (background= the empty part, none = transparent).

[theme]
name=City Pop Dark
base=960x720
background=img/loading_43.png
background_fit=stretch
background_color=#212121
font=../simple/fonts/PTSansNarrow-Bold.ttf
size=32
color=#DCDCDC

; the record coming out of the sleeve (24 frames, a turn in 2 s)
[record]
type=image
rect=380,160,190,300
src=anim/record43_*.png
fps=12
fit=stretch

; the box of the game on the sleeve
[cover]
type=image
rect=78,156,290,308
src=${media.box}|${media.snap}|${media.title}
fit=contain

[no_cover]
type=text
rect=78,156,290,308
text=${game.title}
ifnot=${media.box}${media.snap}${media.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=54
color=#3A3A3A
align=center
wrap=1

[loading]
type=text
rect=600,140,340,90
text=NOW LOADING
font=../simple/fonts/BebasNeue-Regular.ttf
size=66
color=#69D2BA
shadow=#3C6BB1
shadow_offset=5

[bubbles]
type=image
rect=780,236,140,56
src=anim/bubbles_*.png
fps=12
fit=stretch

[game]
type=text
rect=600,300,320,56
text=${game.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=50
color=#7AA1DB
shadow=#3C6BB1
shadow_offset=3
scroll=horizontal

[system]
type=text
rect=600,356,320,40
text=${system.name}
color=#A8A8A8

[percent]
type=text
rect=600,398,320,56
text=${progress}%
font=../simple/fonts/BebasNeue-Regular.ttf
size=50
color=#EC76B2
align=right

[bar]
type=bar
rect=600,462,320,36
value=${progress}
color=#69D2BA

[file]
type=text
rect=60,648,840,51
text=LOADING ${loading.file}
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#002967
scroll=horizontal
