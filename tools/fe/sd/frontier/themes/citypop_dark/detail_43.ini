; Theme "City Pop Dark": Japanese pop of the bubble era, detail screen, 4:3 variant (CRT 640x240).
; Variant of citypop: dark background (the dark mode of bubblism.jp).
; Its ini files are made from those of citypop by citypop_assets.py.
; img/detail_43.png (tools/fe/themegen/citypop_assets.py) has the panels and the help
; bar: the rect= below follow it. Variables and keys: see themes/simple/theme.ini.

[theme]
name=City Pop Dark
base=960x720
background=img/detail_43.png
background_fit=stretch
background_color=#212121
font=../simple/fonts/PTSansNarrow-Bold.ttf
size=32
color=#DCDCDC

[title]
type=text
rect=190,8,744,90
text=${game.title}
font=../simple/fonts/BebasNeue-Regular.ttf
size=72
color=#69D2BA
shadow=#3C6BB1
shadow_offset=4
scroll=horizontal

[no_image]
type=text
rect=42,124,414,310
text=${game.title}
ifnot=${media.snap}${media.title}${media.box}
font=../simple/fonts/BebasNeue-Regular.ttf
size=60
color=#3A3A3A
align=center
wrap=1
layout=media

[image]
type=image
rect=42,124,414,310
src=${media.snap}|${media.title}|${media.box}
fit=contain
layout=media

[video]
type=video
rect=42,124,414,310
src=${media.video}
fit=contain
delay=800
layout=media

[favorite]
type=text
rect=42,124,48,48
text=★
font=../simple/fonts/DejaVuSans-Bold.ttf
size=40
color=#FFA3D9
shadow=#3C6BB1
shadow_offset=3
align=center
if=${game.favorite}
; game in the favorites (X held, F on the keyboard)

; pink tag with the year on the corner of the picture
[year_tag]
type=image
rect=334,96,132,60
src=img/tag.png
if=${game.year}

[year]
type=text
rect=354,96,104,52
text=${game.year}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#3C6BB1
align=right

[maker]
type=text
rect=26,452,440,44
text=${game.developer}
font=../simple/fonts/BebasNeue-Regular.ttf
size=44
color=#7AA1DB
shadow=#3C6BB1
shadow_offset=3
scroll=horizontal

[genre]
type=text
rect=26,498,440,36
text=${game.genre}
color=#A8A8A8
scroll=horizontal

[players]
type=text
rect=26,534,440,36
text=${game.players} players
if=${game.players}
color=#8F8F8F

[stars]
type=text
rect=26,572,440,40
text=${game.stars}
font=../simple/fonts/DejaVuSans-Bold.ttf
size=28
color=#EC76B2

[description]
type=text
rect=504,126,404,300
text=${game.desc}
size=28
color=#DCDCDC
wrap=1
valign=top
scroll=vertical
layout=media

[text_desc]
type=text
rect=48,178,402,250
text=${game.desc}
size=28
color=#DCDCDC
wrap=1
valign=top
scroll=vertical
layout=text

[versions_title]
type=text
rect=504,432,404,42
text=Versions ${versions.status}
font=../simple/fonts/BebasNeue-Regular.ttf
size=38
color=#7AA1DB

[versions_pos]
type=text
rect=504,432,404,42
text=${pos}
font=../simple/fonts/BebasNeue-Regular.ttf
size=38
color=#EC76B2
align=right

[versions]
type=list
rect=494,477,424,153
row_height=51
padding=18
color=#DCDCDC
sel_image=img/sel_43.png
sel_color=#002967
sel_scroll=1
scrollbar_width=4
scrollbar_color=#3A3A3A
scrollbar_knob=#FFA3D9

[help]
type=text
rect=60,648,840,51
text=A PLAY   B/X BACK   HOLD X FAVORITE
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#002967
ifnot=${message}

[message]
type=text
rect=60,648,840,51
text=${message}
font=../simple/fonts/BebasNeue-Regular.ttf
size=40
color=#FFFFFF
shadow=#3C6BB1
shadow_offset=3
if=${message}
; "Added to favorites" / "Removed from favorites", in place of the help for a moment
