; Genres of Frontier's "Lists": the genres of the scraper's sources (ScreenScraper in
; English, ArcadeDB in English or Italian) -> one set of genres, with a subgenre after " / ".
; Read by fe_scrape.py --index (also at the end of every run). Lines: source = Genre / Subgenre
; Case doesn't count. A source genre not here: its first part ("Sports" of "Sports / Golf") is
; looked for, the rest is the subgenre (only for ScreenScraper); genres still unknown are
; listed at the end of fe_scrape.py --index, add them here.
; Genres used: Action, Adult, Adventure, Beat'em up, Board game, Breakout, Casino, Compilation,
; Driving, Educational, Fighting, Lightgun, Mahjong, Maze, Misc, Music, Pinball, Platform,
; Puzzle, Quiz, RPG, Run and gun, Shoot'em up, Shooter, Simulation, Sports, Strategy

